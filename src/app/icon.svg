<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Subtle drop shadow or crease line filter for the front moon edge -->
    <filter id="moonCrease" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-0.8" dy="0.8" stdDeviation="0.6" flood-color="#8C6326" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Back Moon / Crescent (Offset toward bottom-left: cx=44, cy=52, r=32) -->
  <circle cx="43" cy="53" r="33" fill="#CE9F55" />

  <!-- Front Moon (Offset toward top-right: cx=55, cy=43, r=33) with subtle crease line -->
  <circle cx="55" cy="43" r="33" fill="#D9AC64" filter="url(#moonCrease)" stroke="#B3843B" stroke-width="0.75" />
</svg>