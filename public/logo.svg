<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="yellowMoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE180" />
      <stop offset="60%" stop-color="#FDD35D" />
      <stop offset="100%" stop-color="#E89B17" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#E89B17" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Dark/Charcoal Pill Container for contrast on any tab bar -->
  <rect width="64" height="64" rx="16" fill="#171717"/>
  
  <!-- Architectural Grid Lines (Subtle) -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#404040" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#404040" stroke-width="0.8" stroke-dasharray="2,2"/>
  
  <!-- The Signature Yellow Moon (Norangdal) -->
  <circle cx="32" cy="32" r="19" fill="url(#yellowMoon)" filter="url(#subtleGlow)"/>
  
  <!-- Architectural Crescent / Spatial Arc -->
  <path d="M 32 13 A 19 19 0 0 0 32 51 A 19 19 0 0 1 32 13 Z" fill="#FBF0B9" opacity="0.4"/>
</svg>